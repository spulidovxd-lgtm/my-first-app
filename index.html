<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Eventos - Colegio Bolívar</title>

    <link rel="stylesheet" href="style.css">
    <script src="actions.js" defer></script>
</head>

<body>
    <main class="container">

        <h1 id="tituloPrincipal">Colegio Bolívar</h1>
        <p class="subtitle">Contador interactivo de eventos</p>

        <label class="input-label" for="tituloEvento">
            Cambiar título del evento:
        </label>

        <input
            type="text"
            id="tituloEvento"
            placeholder="Escribe el nombre del evento..."
            value="Colegio Bolívar"
        >

        <div class="mode-selector">
            <button class="mode-btn active" id="totalBtn" type="button">
                Clicks totales
            </button>

            <button class="mode-btn" id="cpsBtn" type="button">
                CPS
            </button>
        </div>

        <section class="counter-box" aria-live="polite">
            <p class="counter-label" id="modoLabel">
                Clicks registrados
            </p>

            <h2 id="contador">0</h2>

            <p class="unit" id="unidad">clicks</p>
        </section>

        <div class="buttons">
            <button id="clickBtn" type="button">
                + Registrar Click
            </button>

            <button id="resetBtn" type="button">
                Reiniciar Contador
            </button>
        </div>

        <p class="footer">COLEGIO BOLÍVAR · EVENTOS</p>

    </main>
</body>
</html>
